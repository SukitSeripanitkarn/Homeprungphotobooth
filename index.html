<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#593015" />
    <meta name="description" content="หอมปรุง Photobooth — ใส่รูปของคุณในกรอบหอมปรุง แล้วส่งให้เจ้าหน้าที่พิมพ์เป็นสติกเกอร์วงกลม" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/brand/homprung-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Apply a saved light/dark choice before first paint (no flash).
      try {
        var t = localStorage.getItem('homprung-photobooth:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Chonburi&family=Urbanist:wght@400;500;600;700&family=Anuphan:wght@400;500;600&family=Niramit:wght@600&display=swap" />
    <title>หอมปรุง Photobooth</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
